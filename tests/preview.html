<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab Out 预览</title><link rel="stylesheet" href="../extension/style.css"></head><body>
<main class="app-shell"><header class="topbar"><div class="brand"><img id="workspaceAvatar" src="../extension/icons/icon128.png" alt=""><strong id="workspaceTitle">My Tab Workspace</strong></div><div class="header-almanac"><strong id="dailyDateLine">10月08日 · 星期四</strong><span id="dailyTime">00:00</span><span class="term" id="dailyTerm">寒露</span><span class="ganzhi" id="dailyElement">乙卯日 · 木</span><span class="mini-oracle good"><b>宜</b><span id="dailySuitable"></span></span><span class="mini-oracle careful"><b>慎</b><span id="dailyCaution"></span></span></div><div class="metrics" id="metrics"></div><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索网页或分组"></label><button class="button" data-action="refresh">刷新</button></header><section class="action-strip" id="duplicateStrip" hidden></section><section class="groups" id="groups"></section></main><div class="toast" id="toast"></div>
<script>
const now=Date.now(),tabs=[
{id:1,groupId:10,windowId:1,url:'https://chatgpt.com/c/1',title:'AI product research',active:false,pinned:false,lastAccessed:now-86400000*2},{id:2,groupId:10,windowId:1,url:'https://github.com/example/project',title:'example/project',active:false,pinned:false,lastAccessed:now-3600000},{id:3,groupId:30,windowId:1,url:'https://figma.com/file/1',title:'Website design draft',active:false,pinned:false,lastAccessed:now-86400000*3},{id:4,groupId:20,windowId:1,url:'https://data.example.com/dashboard?utm_source=x',title:'Sales dashboard',active:true,pinned:false,lastAccessed:now},{id:5,groupId:20,windowId:1,url:'https://data.example.com/dashboard',title:'Sales dashboard',active:false,pinned:false,lastAccessed:now-400000},{id:6,groupId:40,windowId:1,url:'https://docs.google.com/document/1',title:'Project brief',active:false,pinned:true,lastAccessed:now-7200000},{id:7,groupId:-1,windowId:1,url:'https://arxiv.org/abs/1234',title:'Research paper',active:false,pinned:false,lastAccessed:now-86400000*4}];
const groups=[{id:10,title:'AI',color:'blue'},{id:20,title:'Data',color:'cyan'},{id:30,title:'Design',color:'purple'},{id:40,title:'Docs',color:'green'}];
const usage={installedAt:now-86400000*8,pages:{'https://chatgpt.com/c/1':{activeMs:120000,reloads:1,lastActiveAt:now-86400000*2},'https://data.example.com/dashboard':{activeMs:2400000,reloads:5,lastActiveAt:now}} ,tabs:{}};
let deferred=[{id:'s1',url:'https://example.com/read',title:'周末阅读：AI 产品方法',completed:false,dismissed:false}];
globalThis.chrome={runtime:{getURL:path=>`chrome-extension://preview/${path}`},tabs:{query:async()=>tabs,update:async()=>{},remove:async()=>{},group:async()=>99,ungroup:async()=>{},reload:async()=>{}},windows:{update:async()=>{}},tabGroups:{get:async id=>groups.find(g=>g.id===id),update:async()=>{}},storage:{local:{get:async keys=>({tabOutUsageV2:usage,deferred}),set:async value=>{if(value.deferred)deferred=value.deferred}}}};
</script><script src="../extension/config.js"></script><script src="../extension/core.js"></script><script src="../extension/app.js"></script></body></html>
